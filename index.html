<!DOCTYPE html>
<html>
<head>
  <title>Bank System</title>

  <style>

    body{
      font-family: Arial;
      background:#f4f4f4;
      text-align:center;
      padding-top:50px;
    }

    .box{
      width:400px;
      background:white;
      margin:auto;
      padding:30px;
      border-radius:10px;
      box-shadow:0 0 10px gray;
    }

    input{
      width:90%;
      padding:10px;
      margin:10px;
    }

    button{
      padding:10px 20px;
      background:blue;
      color:white;
      border:none;
      cursor:pointer;
    }

  </style>

</head>

<body>

<div class="box">

<h1>Bank System</h1>

<input type="text" placeholder="Enter Name">

<input type="number" placeholder="Enter Amount">

<br><br>

<button>Deposit</button>

<button>Withdraw</button>

</div>

</body>
</html>
