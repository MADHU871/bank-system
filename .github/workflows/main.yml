name: Bank System CI/CD

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v3

    - name: Docker Login
      uses: docker/login-action@v2

      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: docker build -t bank-system .

    - name: Tag Docker Image
      run: docker tag bank-system YOUR_DOCKER_USERNAME/bank-system:latest

    - name: Push Docker Image
      run: docker push YOUR_DOCKER_USERNAME/bank-system:latest